<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>

    <div class="container">

<div class="classSelector">
  <label for="schoolClass">
    Выберите класс ученика:
  </label>

  <select id="schoolClass">
    <option value="1">Класс 1</option>
    <option value="2">Класс 2</option>
    <option value="3">Класс 3</option>
    <option value="4">Класс 4</option>
    <option value="5" selected>Класс 5</option>
    <option value="6">Класс 6</option>
    <option value="7">Класс 7</option>
    <option value="8">Класс 8</option>
    <option value="9">Класс 9</option>
    <option value="10">Класс 10</option>
    <option value="11">Класс 11</option>
    <option value="12">Класс 12</option>
  </select>
</div>
        
        Изучаем русский язык!
        <div class=" spacer"></div>
        <textarea id="textInput" placeholder="Здесь вы увидете текст произнесенный Вами"></textarea>
        <div class=" spacer"></div>
        <button id="sendButton" onclick="speech()">Хотите что нибудь сказать? Нажмите здесь - и говорите</button>
        <div class=" spacer"></div>
        <textarea id="textOutput" placeholder="Здесь Вы увидете текст произнесенный Искуственным Интелектом (ИИ)"></textarea>
        <div class=" spacer"></div>
        <button onclick="talk(outp.value)">Желаете послушать еще раз что сказал ИИ - нажмите здесь</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

</body>
</html>
